<?xml version="1.0" encoding="UTF-8"?>
<!-- Spatial Player mark, concept B: play triangle inside a spatial field,
     ringed by an orbiting lobe (head-tracked audio). Sized in the 66/108 safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="accent" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A9D4FF"/>
      <stop offset="0.5" stop-color="#6FA6F5"/>
      <stop offset="1" stop-color="#4B7FE0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#16191F"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="108" height="108" fill="url(#bg)"/>

  <!-- spatial field: two concentric rings -->
  <circle cx="53" cy="55" r="21" fill="none" stroke="#A9D4FF" stroke-opacity="0.30" stroke-width="2.4"/>
  <circle cx="53" cy="55" r="27.5" fill="none" stroke="#A9D4FF" stroke-opacity="0.14" stroke-width="2.4"/>

  <!-- orbit: one highlighted lobe, gap on the far side -->
  <path d="M 61.2 29.2 A 27.5 27.5 0 0 1 79.0 63.4"
        fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>

  <!-- play head -->
  <path d="M 46 43.5 L 67 55 L 46 66.5 Z" fill="url(#accent)"/>
</svg>
