<?xml version="1.0" encoding="UTF-8"?>
<!-- Spatial Player mark, final: play head inside a spatial field, with a
     head-tracked audio lobe orbiting on its own path outside the rings.
     Designed on the 108dp adaptive-icon canvas; glyph lives in the 72dp safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="accent" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A9D4FF"/>
      <stop offset="0.5" stop-color="#6FA6F5"/>
      <stop offset="1" stop-color="#4B7FE0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#16191F"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="108" height="108" fill="url(#bg)"/>

  <!-- spatial field: two concentric rings -->
  <circle cx="53" cy="55" r="20" fill="none" stroke="#A9D4FF" stroke-opacity="0.32" stroke-width="2.4"/>
  <circle cx="53" cy="55" r="26" fill="none" stroke="#A9D4FF" stroke-opacity="0.15" stroke-width="2.4"/>

  <!-- orbit: one highlighted lobe on its own path, gap on the far side -->
  <path d="M 62.4 26.8 A 29.5 29.5 0 0 1 81.0 61.6"
        fill="none" stroke="url(#accent)" stroke-width="5.6" stroke-linecap="round"/>

  <!-- play head -->
  <path d="M 46 43.5 L 67 55 L 46 66.5 Z" fill="url(#accent)"/>
</svg>
